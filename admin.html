<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة الإدارة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui,Tahoma,sans-serif;background:#0b0f14;color:#eee;margin:0;padding:16px}h1,h2{color:#d9b25e}input,select{background:#151b24;color:#eee;border:1px solid #333;border-radius:6px;padding:6px;font:inherit;width:100%;box-sizing:border-box}button{background:#d9b25e;color:#111;border:0;border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer;margin:2px}button.d{background:#a33;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:4px;border-bottom:1px solid #222;font-size:14px}.box{max-width:420px;margin:60px auto}#msg{color:#7ddc8a;min-height:20px}.err{color:#f66!important}.wrap{overflow-x:auto}</style></head><body>
<div id="login" class="box"><h1>لوحة الإدارة</h1><p>البريد</p><input id="em" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" dir="ltr"><p>كلمة المرور</p><input id="pw" type="password" autocomplete="current-password"><p><button id="lg">دخول</button></p><div id="lm" class="err"></div></div>
<div id="app" style="display:none"><div style="display:flex;justify-content:space-between"><h1>لوحة الإدارة</h1><div><span id="who"></span> <button id="out">خروج</button></div></div><div id="msg"></div>
<h2>المحاضرات والكتب</h2><div class="wrap"><table><thead><tr><th>العنوان</th><th>المؤلف</th><th>التصنيف / المادة</th><th>عدد الدروس</th><th>الغلاف (اسم الملف)</th><th>الشيخ</th><th></th></tr></thead><tbody id="wb"></tbody></table></div><p><button id="aw">+ إضافة عمل</button></p>
<h2>المشايخ</h2><div class="wrap"><table><thead><tr><th>الاسم</th><th>نبذة</th><th>رابط الصورة</th><th></th></tr></thead><tbody id="sb"></tbody></table></div><p><button id="as">+ إضافة شيخ</button></p></div>
<script>
const sb=supabase.createClient("https://jwemlbfcyzlqcqetznib.supabase.co","sb_publishable_hu9vY9bjDDvxvK9ygzSBXw_MAe9IXI8");
const $=i=>document.getElementById(i);let W=[],S=[];
const msg=(t,e)=>{$('msg').textContent=t;$('msg').className=e?'err':''};
function inp(v){const i=document.createElement('input');i.value=v??'';return i}
async function load(){const a=await sb.from('works').select('*').order('sort').order('id');const b=await sb.from('sheikhs').select('*').order('name');if(a.error||b.error){msg((a.error||b.error).message,1);return}W=a.data;S=b.data;draw()}
function sel(v){const s=document.createElement('select');[''].concat(S.map(x=>x.name)).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n||'—';s.appendChild(o)});s.value=v||'';return s}
function draw(){const wb=$('wb');wb.innerHTML='';W.forEach(w=>{const tr=document.createElement('tr');const f={title:inp(w.title),author:inp(w.author),category:inp(w.category),n:inp(w.n),cover:inp(w.cover),sheikh:sel(w.sheikh)};f.n.type='number';Object.values(f).forEach(e=>{const td=document.createElement('td');td.appendChild(e);tr.appendChild(td)});const td=document.createElement('td');const sv=document.createElement('button');sv.textContent='حفظ';sv.onclick=async()=>{const r={title:f.title.value.trim(),author:f.author.value,category:f.category.value,n:+f.n.value||0,cover:f.cover.value,sheikh:f.sheikh.value};if(!r.title){msg('العنوان مطلوب',1);return}const q=w.id?await sb.from('works').update(r).eq('id',w.id).select():await sb.from('works').insert(r).select();if(q.error||!q.data.length){msg(q.error?q.error.message:'لم يتم الحفظ (ليس لديك صلاحية)',1);return}Object.assign(w,q.data[0]);msg('تم الحفظ: '+r.title)};const dl=document.createElement('button');dl.className='d';dl.textContent='حذف';dl.onclick=async()=>{if(!confirm('حذف؟'))return;if(w.id){const q=await sb.from('works').delete().eq('id',w.id).select();if(q.error||!q.data.length){msg(q.error?q.error.message:'لم يتم الحذف',1);return}}W=W.filter(x=>x!==w);draw();msg('تم الحذف')};td.append(sv,dl);tr.appendChild(td);wb.appendChild(tr)});
const s=$('sb');s.innerHTML='';S.forEach(x=>{const tr=document.createElement('tr');const f={name:inp(x.name),bio:inp(x.bio),photo:inp(x.photo)};if(x.name)f.name.disabled=true;Object.values(f).forEach(e=>{const td=document.createElement('td');td.appendChild(e);tr.appendChild(td)});const td=document.createElement('td');const sv=document.createElement('button');sv.textContent='حفظ';sv.onclick=async()=>{const r={name:f.name.value.trim(),bio:f.bio.value,photo:f.photo.value};if(!r.name){msg('الاسم مطلوب',1);return}const q=await sb.from('sheikhs').upsert(r).select();if(q.error||!q.data.length){msg(q.error?q.error.message:'لم يتم الحفظ',1);return}x.name=r.name;msg('تم الحفظ: '+r.name);load()};const dl=document.createElement('button');dl.className='d';dl.textContent='حذف';dl.onclick=async()=>{if(!confirm('حذف؟'))return;if(x.name){const q=await sb.from('sheikhs').delete().eq('name',x.name).select();if(q.error||!q.data.length){msg(q.error?q.error.message:'لم يتم الحذف',1);return}}S=S.filter(y=>y!==x);draw()};td.append(sv,dl);tr.appendChild(td);s.appendChild(tr)})}
$('aw').onclick=()=>{W.push({title:'',author:'',category:'',n:0,cover:'',sheikh:''});draw()};$('as').onclick=()=>{S.push({name:'',bio:'',photo:''});draw()};
async function show(sess){if(!sess){$('login').style.display='';$('app').style.display='none';return}$('login').style.display='none';$('app').style.display='';$('who').textContent=sess.user.email;load()}
$('sp').onchange=()=>{$('pw').type=$('sp').checked?'text':'password'};
$('lg').onclick=async()=>{$('lm').textContent='';const r=await sb.auth.signInWithPassword({email:$('em').value.trim().toLowerCase(),password:$('pw').value});if(r.error)$('lm').textContent='تعذر الدخول: '+r.error.message;else show(r.data.session)};
$('out').onclick=async()=>{await sb.auth.signOut();show(null)};
sb.auth.getSession().then(r=>show(r.data.session));
</script></body></html>
